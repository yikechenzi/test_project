version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-test-postgres
    environment:
      POSTGRES_DB: ai_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session
  redis:
    image: redis:7-alpine
    container_name: ai-test-redis
    ports:
      - "6379:6379"
    networks:
      - ai-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-test-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/ai_test_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - test_reports:/app/reports
      - test_screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-test-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-test-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-test-network
    command: npm run dev -- --host 0.0.0.0

  # Playwright Test Runner
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
    container_name: ai-test-playwright
    environment:
      - DISPLAY=:99
    volumes:
      - ./backend:/app
      - test_screenshots:/app/screenshots
      - test_videos:/app/videos
    depends_on:
      - backend
    networks:
      - ai-test-network
    command: tail -f /dev/null

volumes:
  postgres_data:
  test_reports:
  test_screenshots:
  test_videos:

networks:
  ai-test-network:
    driver: bridge